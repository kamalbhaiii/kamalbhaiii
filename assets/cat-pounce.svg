<svg width="180" height="90" viewBox="0 0 180 90" xmlns="http://www.w3.org/2000/svg">
<title>Pouncing cat</title>
<defs>
  <clipPath id="cpClip"><rect x="0" y="0" width="180" height="90" rx="12"/></clipPath>
</defs>
<g clip-path="url(#cpClip)">

<!-- shadow shrinks/fades as the cat leaps higher -->
<ellipse cx="90" cy="78" rx="26" ry="4" fill="#000000" opacity="0.2">
  <animate attributeName="rx" values="28;12;28" dur="1.8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.22;0.06;0.22" dur="1.8s" repeatCount="indefinite"/>
</ellipse>

<g transform="translate(40,60)">
  <animateTransform attributeName="transform" additive="sum" type="translate"
    values="0,0;8,-4;36,-28;66,-4;78,0;78,0"
    keyTimes="0;0.15;0.5;0.8;0.95;1"
    calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
    dur="1.8s" repeatCount="indefinite"/>
  <animateTransform attributeName="transform" additive="sum" type="rotate"
    values="0;-10;-2;12;0;0"
    keyTimes="0;0.15;0.5;0.8;0.95;1"
    calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
    dur="1.8s" repeatCount="indefinite"/>

  <g fill="#2a1533" stroke="#2a1533" stroke-linejoin="round">
    <!-- tail streaming behind during flight -->
    <path d="M -14 4 C -28 0, -30 -14, -18 -18" fill="none" stroke-width="4.5" stroke-linecap="round"/>

    <!-- hind legs, coiled then kicked back at apex -->
    <path d="M -6 10 L -10 20" stroke-width="6.5" stroke-linecap="round">
      <animate attributeName="d" values="M -6 10 L -8 19;M -6 10 L -18 14;M -6 10 L -8 19" keyTimes="0;0.5;1" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 2 12 L 0 22" stroke-width="6.5" stroke-linecap="round">
      <animate attributeName="d" values="M 2 12 L 2 21;M 2 12 L -8 18;M 2 12 L 2 21" keyTimes="0;0.5;1" dur="1.8s" repeatCount="indefinite"/>
    </path>

    <!-- body -->
    <ellipse cx="0" cy="2" rx="17" ry="10" stroke="#ff8fd6" stroke-width="1"/>

    <!-- front legs, reaching forward -->
    <path d="M 14 4 L 24 2" stroke-width="6.5" stroke-linecap="round">
      <animate attributeName="d" values="M 14 4 L 18 12;M 14 4 L 28 -4;M 14 4 L 18 12" keyTimes="0;0.5;1" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M 16 6 L 26 10" stroke-width="6.5" stroke-linecap="round">
      <animate attributeName="d" values="M 16 6 L 22 14;M 16 6 L 32 0;M 16 6 L 22 14" keyTimes="0;0.5;1" dur="1.8s" repeatCount="indefinite"/>
    </path>

    <!-- head, eyes locked forward -->
    <circle cx="22" cy="-8" r="10" stroke="#ff8fd6" stroke-width="1"/>
    <path d="M 15 -14 L 12 -23 L 21 -17 Z" stroke="#ff8fd6" stroke-width="1"/>
    <path d="M 27 -15 L 30 -24 L 34 -16 Z" stroke="#ff8fd6" stroke-width="1"/>
    <path d="M 15.5 -16 L 13.5 -20.5 L 19.5 -17 Z" fill="#ff6ec7" stroke="none"/>
    <path d="M 26.5 -17 L 28.5 -21.5 L 31.5 -17 Z" fill="#ff6ec7" stroke="none"/>
  </g>

  <g fill="#ffe6f7" stroke="none">
    <ellipse cx="19" cy="-9" rx="1.8" ry="2.3"/>
    <ellipse cx="25" cy="-9" rx="1.8" ry="2.3"/>
  </g>
  <g stroke="#e6c9ff" stroke-width="0.7" stroke-linecap="round" opacity="0.8">
    <path d="M 13 -5 L 6 -6 M 13 -3 L 6 -2"/>
  </g>
</g>
</g>
</svg>
