<svg width="180" height="80" viewBox="0 0 180 80" xmlns="http://www.w3.org/2000/svg">
<title>Cat playing with yarn</title>
<defs>
  <clipPath id="cyClip"><rect x="0" y="0" width="180" height="80" rx="12"/></clipPath>
</defs>
<g clip-path="url(#cyClip)">

<ellipse cx="90" cy="66" rx="44" ry="4" fill="#000000" opacity="0.18"/>

<!-- yarn ball, rolls back and forth as it's batted -->
<g transform="translate(130,54)">
  <animateTransform attributeName="transform" additive="sum" type="translate" values="0,0;22,0;0,0" dur="1.6s" repeatCount="indefinite"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0;360" dur="0.8s" repeatCount="indefinite"/>
    <circle r="8" fill="#ff2fb0"/>
    <path d="M -7,-2 Q 0,-8 7,-2 M -7,2 Q 0,8 7,2 M -5,-5 Q 0,0 5,5 M -5,5 Q 0,0 5,-5" stroke="#ff8fd6" stroke-width="1" fill="none" opacity="0.8"/>
  </g>
</g>

<g transform="translate(70,50)">
  <g fill="#2a1533" stroke="#2a1533" stroke-linejoin="round">
    <!-- tail flicks with excitement -->
    <path d="M32 6 C 46 2, 48 -14, 36 -18" fill="none" stroke-width="4.5" stroke-linecap="round">
      <animate attributeName="d" values="M32 6 C 46 2, 48 -14, 36 -18;M32 6 C 48 8, 52 -8, 34 -20;M32 6 C 46 2, 48 -14, 36 -18" dur="0.5s" repeatCount="indefinite"/>
    </path>

    <!-- hind haunches, coiled and low -->
    <ellipse cx="16" cy="10" rx="10" ry="8"/>
    <path d="M22 16 L26 26" stroke-width="6" stroke-linecap="round"/>
    <path d="M10 17 L10 27" stroke-width="6" stroke-linecap="round"/>

    <!-- crouched body -->
    <ellipse cx="0" cy="6" rx="22" ry="10" stroke="#ff8fd6" stroke-width="1"/>

    <!-- front paw batting forward at the yarn -->
    <path d="M -16 12 L -30 18" stroke-width="6" stroke-linecap="round">
      <animate attributeName="d" values="M -16 12 L -24 20;M -16 12 L -34 6;M -16 12 L -24 20" dur="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M -14 14 L -22 24" stroke-width="6" stroke-linecap="round"/>

    <!-- head, tracking the yarn -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="4 -20 -2;-10 -20 -2;4 -20 -2" dur="0.8s" repeatCount="indefinite"/>
      <circle cx="-20" cy="-2" r="11" stroke="#ff8fd6" stroke-width="1"/>
      <path d="M -27 -9 L -30 -19 L -18 -12 Z" stroke="#ff8fd6" stroke-width="1"/>
      <path d="M -11 -9 L -6 -19 L -17 -12 Z" stroke="#ff8fd6" stroke-width="1"/>
      <path d="M -26 -11.5 L -28 -16.5 L -21.5 -12.5 Z" fill="#ff6ec7" stroke="none"/>
      <path d="M -12.5 -11.5 L -10 -16.5 L -18 -12.5 Z" fill="#ff6ec7" stroke="none"/>
    </g>
  </g>

  <g stroke="none" fill="#ffe6f7">
    <animateTransform attributeName="transform" type="rotate" values="4 -20 -2;-10 -20 -2;4 -20 -2" dur="0.8s" repeatCount="indefinite"/>
    <ellipse cx="-24" cy="-3" rx="1.7" ry="2.2"/>
    <ellipse cx="-16" cy="-3" rx="1.7" ry="2.2"/>
  </g>
  <g stroke="#e6c9ff" stroke-width="0.7" stroke-linecap="round" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" values="4 -20 -2;-10 -20 -2;4 -20 -2" dur="0.8s" repeatCount="indefinite"/>
    <path d="M -30 -1 L -38 -2.5 M -30 1.5 L -39 1.5"/>
  </g>
</g>
</g>
</svg>
