<svg width="180" height="90" viewBox="0 0 180 90" xmlns="http://www.w3.org/2000/svg">
<title>Cat chasing its tail</title>
<defs>
  <clipPath id="ctClip"><rect x="0" y="0" width="180" height="90" rx="12"/></clipPath>
</defs>
<g clip-path="url(#ctClip)">

<ellipse cx="90" cy="76" rx="34" ry="4" fill="#000000" opacity="0.18"/>

<!-- motion-blur ring sells the spin -->
<circle cx="90" cy="44" r="24" fill="none" stroke="#ff6ec7" stroke-width="1.5" opacity="0">
  <animate attributeName="opacity" values="0;0.3;0" dur="1.4s" repeatCount="indefinite"/>
  <animate attributeName="r" values="16;26;16" dur="1.4s" repeatCount="indefinite"/>
</circle>

<!-- whole cat spins in place, chasing its own tail -->
<g transform="translate(90,44)">
  <animateTransform attributeName="transform" additive="sum" type="rotate" values="0;360" dur="1.4s" repeatCount="indefinite"/>

  <g fill="#2a1533" stroke="#2a1533" stroke-linejoin="round">
    <!-- tail, curved out from body center -->
    <path d="M4 -2 C 22 -6, 26 12, 16 20 C 10 24, 2 22, 0 16" fill="none" stroke-width="5" stroke-linecap="round"/>

    <!-- legs, tucked and scrabbling -->
    <path d="M -8 12 L -14 20" stroke-width="6" stroke-linecap="round">
      <animate attributeName="d" values="M -8 12 L -14 20;M -8 12 L -16 16;M -8 12 L -14 20" dur="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M 8 12 L 14 20" stroke-width="6" stroke-linecap="round">
      <animate attributeName="d" values="M 8 12 L 14 20;M 8 12 L 16 16;M 8 12 L 14 20" dur="0.3s" repeatCount="indefinite" begin="0.15s"/>
    </path>

    <!-- body, curled -->
    <ellipse cx="0" cy="4" rx="15" ry="13" stroke="#ff8fd6" stroke-width="1"/>

    <!-- head, snapping toward the tail -->
    <circle cx="-4" cy="-9" r="10" stroke="#ff8fd6" stroke-width="1"/>
    <path d="M -11 -15 L -14 -24 L -4 -18 Z" stroke="#ff8fd6" stroke-width="1"/>
    <path d="M 1 -16 L 3 -25 L 8 -17 Z" stroke="#ff8fd6" stroke-width="1"/>
    <path d="M -10.5 -17 L -12.5 -21.5 L -6.5 -18 Z" fill="#ff6ec7" stroke="none"/>
    <path d="M 0.5 -18 L 1.7 -22.5 L 5.5 -18.5 Z" fill="#ff6ec7" stroke="none"/>
  </g>

  <g fill="#ffe6f7" stroke="none">
    <ellipse cx="-7" cy="-10" rx="1.5" ry="2"/>
    <ellipse cx="-1" cy="-10" rx="1.5" ry="2"/>
  </g>
  <path d="M -4 -6 L -6 -4 M -4 -6 L -2 -4" stroke="#1a0f24" stroke-width="1" stroke-linecap="round" fill="none"/>
</g>
</g>
</svg>
