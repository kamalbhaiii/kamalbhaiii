<svg width="480" height="200" viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Consolas',monospace">
<title>Kamal Sharma - GitHub Stats</title>

<defs>
  <linearGradient id="sBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a0b2e"/>
    <stop offset="100%" stop-color="#2d0f3f"/>
  </linearGradient>
  <linearGradient id="sPink" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ff2fb0"/>
    <stop offset="100%" stop-color="#9b30ff"/>
  </linearGradient>
  <filter id="sGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="sClip"><rect x="0" y="0" width="480" height="200" rx="16"/></clipPath>

  <!-- reusable paw-print motif (decorative accent) -->
  <symbol id="pawPrint" viewBox="0 0 40 40">
    <ellipse cx="20" cy="25" rx="10" ry="8.5"/>
    <ellipse cx="8" cy="12" rx="4.2" ry="5.4" transform="rotate(-18 8 12)"/>
    <ellipse cx="18" cy="6.5" rx="4.4" ry="5.6"/>
    <ellipse cx="28.5" cy="9" rx="4.2" ry="5.4" transform="rotate(14 28.5 9)"/>
    <ellipse cx="34.5" cy="18" rx="3.8" ry="4.8" transform="rotate(32 34.5 18)"/>
  </symbol>
</defs>

<g clip-path="url(#sClip)">
<rect width="480" height="200" fill="url(#sBg)"/>
<circle cx="440" cy="20" r="90" fill="#ff2fb0" opacity="0.12"/>
<circle cx="20" cy="190" r="80" fill="#9b30ff" opacity="0.12"/>
<use href="#pawPrint" x="450" y="172" width="22" height="22" fill="#ff8fd6" opacity="0.2" transform="rotate(-14 461 183)"/>

<text x="24" y="34" font-size="16" font-weight="700" fill="#ffe6f7">Kamal's GitHub Stats</text>

<!-- rank ring -->
<g transform="translate(90,120)">
  <circle r="58" fill="none" stroke="#3a1f4d" stroke-width="10"/>
  <circle r="58" fill="none" stroke="url(#sPink)" stroke-width="10" stroke-linecap="round"
    stroke-dasharray="364" stroke-dashoffset="364" transform="rotate(-90)">
    <animate attributeName="stroke-dashoffset" values="364;80" dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
  </circle>
  <text text-anchor="middle" y="-2" font-size="22" font-weight="800" fill="#ffffff">A+</text>
  <text text-anchor="middle" y="18" font-size="9" fill="#c9a9e8">TOP RANK</text>
</g>

<!-- stat rows -->
<g font-size="12.5" font-family="'Consolas',monospace">
  <g transform="translate(190,58)" opacity="0">
    <animate attributeName="opacity" to="1" begin="0.5s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" additive="sum" type="translate" values="40,0;0,0" dur="0.5s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
    <text fill="#ff8fd6">★ Total Stars Earned</text>
    <text x="260" fill="#ffffff" font-weight="700" text-anchor="end">120+</text>
    <rect y="8" width="260" height="6" rx="3" fill="#3a1f4d"/>
    <rect y="8" width="0" height="6" rx="3" fill="url(#sPink)"><animate attributeName="width" values="0;210" dur="1.1s" begin="0.7s" fill="freeze"/></rect>
  </g>
  <g transform="translate(190,96)" opacity="0">
    <animate attributeName="opacity" to="1" begin="0.7s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" additive="sum" type="translate" values="40,0;0,0" dur="0.5s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
    <text fill="#c084fc">⑂ Total Commits</text>
    <text x="260" fill="#ffffff" font-weight="700" text-anchor="end">900+</text>
    <rect y="8" width="260" height="6" rx="3" fill="#3a1f4d"/>
    <rect y="8" width="0" height="6" rx="3" fill="url(#sPink)"><animate attributeName="width" values="0;240" dur="1.1s" begin="0.9s" fill="freeze"/></rect>
  </g>
  <g transform="translate(190,134)" opacity="0">
    <animate attributeName="opacity" to="1" begin="0.9s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" additive="sum" type="translate" values="40,0;0,0" dur="0.5s" begin="0.9s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
    <text fill="#ff8fd6">⑃ Total PRs</text>
    <text x="260" fill="#ffffff" font-weight="700" text-anchor="end">45+</text>
    <rect y="8" width="260" height="6" rx="3" fill="#3a1f4d"/>
    <rect y="8" width="0" height="6" rx="3" fill="url(#sPink)"><animate attributeName="width" values="0;150" dur="1.1s" begin="1.1s" fill="freeze"/></rect>
  </g>
  <g transform="translate(190,172)" opacity="0">
    <animate attributeName="opacity" to="1" begin="1.1s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" additive="sum" type="translate" values="40,0;0,0" dur="0.5s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" keyTimes="0;1"/>
    <text fill="#c084fc">◈ Repositories</text>
    <text x="260" fill="#ffffff" font-weight="700" text-anchor="end">93+</text>
    <rect y="8" width="260" height="6" rx="3" fill="#3a1f4d"/>
    <rect y="8" width="0" height="6" rx="3" fill="url(#sPink)"><animate attributeName="width" values="0;190" dur="1.1s" begin="1.3s" fill="freeze"/></rect>
  </g>
</g>

<rect x="1" y="1" width="478" height="198" rx="15" fill="none" stroke="#ff6ec7" stroke-opacity="0.35" stroke-width="1.5"/>
</g>
</svg>
