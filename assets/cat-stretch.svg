<svg width="180" height="80" viewBox="0 0 180 80" xmlns="http://www.w3.org/2000/svg">
<title>Stretching cat</title>
<defs>
  <clipPath id="csClip"><rect x="0" y="0" width="180" height="80" rx="12"/></clipPath>
</defs>
<g clip-path="url(#csClip)">

<ellipse cx="90" cy="66" rx="44" ry="4" fill="#000000" opacity="0.18"/>

<g transform="translate(70,50)">
  <animateTransform attributeName="transform" additive="sum" type="translate" values="0,0;0,-3;0,0" dur="2.4s" repeatCount="indefinite"/>

  <g fill="#2a1533" stroke="#2a1533" stroke-linejoin="round">
    <!-- tail, curling lazily upward behind -->
    <path d="M34 8 C 50 6, 54 -10, 44 -16" fill="none" stroke-width="4.5" stroke-linecap="round">
      <animate attributeName="d" values="M34 8 C 50 6, 54 -10, 44 -16;M34 8 C 52 10, 56 -6, 42 -18;M34 8 C 50 6, 54 -10, 44 -16" dur="2.4s" repeatCount="indefinite"/>
    </path>

    <!-- hind legs: low, weight-bearing -->
    <path d="M24 10 L28 24" stroke-width="6" stroke-linecap="round"/>
    <path d="M14 11 L16 24" stroke-width="6" stroke-linecap="round"/>

    <!-- arched back body -->
    <ellipse cx="20" cy="2" rx="24" ry="12" stroke="#ff8fd6" stroke-width="1"/>

    <!-- front legs, stretched way forward and low -->
    <path d="M -4 8 L -28 16" stroke-width="6" stroke-linecap="round">
      <animate attributeName="d" values="M -4 8 L -24 14;M -4 8 L -32 18;M -4 8 L -24 14" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 10 L -24 20" stroke-width="6" stroke-linecap="round">
      <animate attributeName="d" values="M 0 10 L -20 18;M 0 10 L -28 22;M 0 10 L -20 18" dur="2.4s" repeatCount="indefinite"/>
    </path>

    <!-- head, lowered near the extended front paws -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;-6,3;0,0" dur="2.4s" repeatCount="indefinite"/>
      <circle cx="-26" cy="8" r="11" stroke="#ff8fd6" stroke-width="1"/>
      <path d="M -33 1 L -37 -9 L -25 -2 Z" stroke="#ff8fd6" stroke-width="1"/>
      <path d="M -17 1 L -12 -9 L -23 -2 Z" stroke="#ff8fd6" stroke-width="1"/>
      <path d="M -32 -1.5 L -34.5 -6.5 L -28 -2.5 Z" fill="#ff6ec7" stroke="none"/>
      <path d="M -18.5 -1.5 L -16 -6.5 L -23 -2.5 Z" fill="#ff6ec7" stroke="none"/>
    </g>
  </g>

  <g stroke="none">
    <animateTransform attributeName="transform" type="translate" values="0,0;-6,3;0,0" dur="2.4s" repeatCount="indefinite"/>
    <g fill="#ffe6f7">
      <ellipse cx="-30" cy="7" rx="1.7" ry="2.2"><animate attributeName="ry" values="2.2;2.2;0.2;2.2;2.2" keyTimes="0;0.82;0.87;0.92;1" dur="3.6s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="-22" cy="7" rx="1.7" ry="2.2"><animate attributeName="ry" values="2.2;2.2;0.2;2.2;2.2" keyTimes="0;0.82;0.87;0.92;1" dur="3.6s" repeatCount="indefinite"/></ellipse>
    </g>
  </g>
  <g stroke="#e6c9ff" stroke-width="0.7" stroke-linecap="round" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0,0;-6,3;0,0" dur="2.4s" repeatCount="indefinite"/>
    <path d="M -37 8 L -45 6.5 M -37 10.5 L -46 10.5"/>
  </g>
</g>
</g>
</svg>
