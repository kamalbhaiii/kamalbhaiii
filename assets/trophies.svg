<svg width="820" height="218" viewBox="0 0 820 218" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Consolas',monospace">
<title>Kamal Sharma - Trophies</title>

<defs>
  <linearGradient id="tBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1a0b2e"/>
    <stop offset="100%" stop-color="#2d0f3f"/>
  </linearGradient>
  <linearGradient id="tShine" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
    <stop offset="52%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <filter id="tGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="tClip"><rect x="0" y="0" width="820" height="218" rx="16"/></clipPath>

  <!-- reusable paw-print motif (decorative accent) -->
  <symbol id="pawPrint" viewBox="0 0 40 40">
    <ellipse cx="20" cy="25" rx="10" ry="8.5"/>
    <ellipse cx="8" cy="12" rx="4.2" ry="5.4" transform="rotate(-18 8 12)"/>
    <ellipse cx="18" cy="6.5" rx="4.4" ry="5.6"/>
    <ellipse cx="28.5" cy="9" rx="4.2" ry="5.4" transform="rotate(14 28.5 9)"/>
    <ellipse cx="34.5" cy="18" rx="3.8" ry="4.8" transform="rotate(32 34.5 18)"/>
  </symbol>
</defs>

<g clip-path="url(#tClip)">
<rect width="820" height="218" fill="url(#tBg)"/>
<use href="#pawPrint" x="786" y="10" width="20" height="20" fill="#ff8fd6" opacity="0.18" transform="rotate(166 796 20)"/>

<!-- trophy cell template repeated -->
<g font-family="'Consolas',monospace">
  <!-- cell 1 -->
  <g transform="translate(20,16)" opacity="0">
    <animate attributeName="opacity" to="1" begin="0.1s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" additive="sum" type="scale" values="0.7;1.08;1" keyTimes="0;0.7;1" dur="0.5s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1;0.3 0 0.2 1"/>
    <rect width="120" height="148" rx="12" fill="#241333" stroke="#ffd700" stroke-opacity="0.55" stroke-width="1.3"/>
    <text x="60" y="26" text-anchor="middle" font-size="9" fill="#c9a9e8">Commits</text>
    <text x="60" y="70" text-anchor="middle" font-size="30" filter="url(#tGlow)">🏆</text>
    <text x="60" y="98" text-anchor="middle" font-size="9" fill="#ffd700" font-weight="700">SSS</text>
    <text x="60" y="118" text-anchor="middle" font-size="8" fill="#e6d3ff">900+ commits</text>
    <text x="60" y="134" text-anchor="middle" font-size="7" fill="#8a6a9e">RANK A+</text>
    <rect width="120" height="148" rx="12" fill="url(#tShine)" transform="skewX(-15)"><animate attributeName="x" values="-160;200" dur="3s" begin="1.5s" repeatCount="indefinite"/></rect>
  </g>
  <!-- cell 2 -->
  <g transform="translate(154,16)" opacity="0">
    <animate attributeName="opacity" to="1" begin="0.25s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" additive="sum" type="scale" values="0.7;1.08;1" keyTimes="0;0.7;1" dur="0.5s" begin="0.25s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1;0.3 0 0.2 1"/>
    <rect width="120" height="148" rx="12" fill="#241333" stroke="#c084fc" stroke-opacity="0.55" stroke-width="1.3"/>
    <text x="60" y="26" text-anchor="middle" font-size="9" fill="#c9a9e8">Pull Requests</text>
    <text x="60" y="70" text-anchor="middle" font-size="30" filter="url(#tGlow)">🥈</text>
    <text x="60" y="98" text-anchor="middle" font-size="9" fill="#c084fc" font-weight="700">S</text>
    <text x="60" y="118" text-anchor="middle" font-size="8" fill="#e6d3ff">45+ merged</text>
    <text x="60" y="134" text-anchor="middle" font-size="7" fill="#8a6a9e">RANK A</text>
    <rect width="120" height="148" rx="12" fill="url(#tShine)" transform="skewX(-15)"><animate attributeName="x" values="-160;200" dur="3s" begin="1.7s" repeatCount="indefinite"/></rect>
  </g>
  <!-- cell 3 -->
  <g transform="translate(288,16)" opacity="0">
    <animate attributeName="opacity" to="1" begin="0.4s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" additive="sum" type="scale" values="0.7;1.08;1" keyTimes="0;0.7;1" dur="0.5s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1;0.3 0 0.2 1"/>
    <rect width="120" height="148" rx="12" fill="#241333" stroke="#ff8fd6" stroke-opacity="0.55" stroke-width="1.3"/>
    <text x="60" y="26" text-anchor="middle" font-size="9" fill="#c9a9e8">Stars</text>
    <text x="60" y="70" text-anchor="middle" font-size="30" filter="url(#tGlow)">⭐</text>
    <text x="60" y="98" text-anchor="middle" font-size="9" fill="#ff8fd6" font-weight="700">A</text>
    <text x="60" y="118" text-anchor="middle" font-size="8" fill="#e6d3ff">120+ stars</text>
    <text x="60" y="134" text-anchor="middle" font-size="7" fill="#8a6a9e">RANK B+</text>
    <rect width="120" height="148" rx="12" fill="url(#tShine)" transform="skewX(-15)"><animate attributeName="x" values="-160;200" dur="3s" begin="1.9s" repeatCount="indefinite"/></rect>
  </g>
  <!-- cell 4 -->
  <g transform="translate(422,16)" opacity="0">
    <animate attributeName="opacity" to="1" begin="0.55s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" additive="sum" type="scale" values="0.7;1.08;1" keyTimes="0;0.7;1" dur="0.5s" begin="0.55s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1;0.3 0 0.2 1"/>
    <rect width="120" height="148" rx="12" fill="#241333" stroke="#ffd700" stroke-opacity="0.55" stroke-width="1.3"/>
    <text x="60" y="26" text-anchor="middle" font-size="9" fill="#c9a9e8">Repositories</text>
    <text x="60" y="70" text-anchor="middle" font-size="30" filter="url(#tGlow)">📦</text>
    <text x="60" y="98" text-anchor="middle" font-size="9" fill="#ffd700" font-weight="700">S</text>
    <text x="60" y="118" text-anchor="middle" font-size="8" fill="#e6d3ff">93+ repos</text>
    <text x="60" y="134" text-anchor="middle" font-size="7" fill="#8a6a9e">RANK A</text>
    <rect width="120" height="148" rx="12" fill="url(#tShine)" transform="skewX(-15)"><animate attributeName="x" values="-160;200" dur="3s" begin="2.1s" repeatCount="indefinite"/></rect>
  </g>
  <!-- cell 5 -->
  <g transform="translate(556,16)" opacity="0">
    <animate attributeName="opacity" to="1" begin="0.7s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" additive="sum" type="scale" values="0.7;1.08;1" keyTimes="0;0.7;1" dur="0.5s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1;0.3 0 0.2 1"/>
    <rect width="120" height="148" rx="12" fill="#241333" stroke="#9b30ff" stroke-opacity="0.55" stroke-width="1.3"/>
    <text x="60" y="26" text-anchor="middle" font-size="9" fill="#c9a9e8">Followers</text>
    <text x="60" y="70" text-anchor="middle" font-size="30" filter="url(#tGlow)">👥</text>
    <text x="60" y="98" text-anchor="middle" font-size="9" fill="#9b30ff" font-weight="700">B+</text>
    <text x="60" y="118" text-anchor="middle" font-size="8" fill="#e6d3ff">Growing</text>
    <text x="60" y="134" text-anchor="middle" font-size="7" fill="#8a6a9e">RANK B</text>
    <rect width="120" height="148" rx="12" fill="url(#tShine)" transform="skewX(-15)"><animate attributeName="x" values="-160;200" dur="3s" begin="2.3s" repeatCount="indefinite"/></rect>
  </g>
  <!-- cell 6 -->
  <g transform="translate(690,16)" opacity="0">
    <animate attributeName="opacity" to="1" begin="0.85s" dur="0.35s" fill="freeze"/>
    <animateTransform attributeName="transform" additive="sum" type="scale" values="0.7;1.08;1" keyTimes="0;0.7;1" dur="0.5s" begin="0.85s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1;0.3 0 0.2 1"/>
    <rect width="120" height="148" rx="12" fill="#241333" stroke="#ff2fb0" stroke-opacity="0.55" stroke-width="1.3"/>
    <text x="60" y="26" text-anchor="middle" font-size="9" fill="#c9a9e8">Experience</text>
    <text x="60" y="70" text-anchor="middle" font-size="30" filter="url(#tGlow)">🚀</text>
    <text x="60" y="98" text-anchor="middle" font-size="9" fill="#ff2fb0" font-weight="700">SS</text>
    <text x="60" y="118" text-anchor="middle" font-size="8" fill="#e6d3ff">DevOps craft</text>
    <text x="60" y="134" text-anchor="middle" font-size="7" fill="#8a6a9e">RANK A+</text>
    <rect width="120" height="148" rx="12" fill="url(#tShine)" transform="skewX(-15)"><animate attributeName="x" values="-160;200" dur="3s" begin="2.5s" repeatCount="indefinite"/></rect>
  </g>
</g>

<!-- ============ CAT MOTIF: sleeping cat curled in the footer strip ============ -->
<g transform="translate(46,196)">
  <ellipse cx="0" cy="14" rx="34" ry="4" fill="#000000" opacity="0.2"/>

  <g fill="#2a1533" stroke="#ff8fd6" stroke-linejoin="round" stroke-width="1">
    <!-- curled body, one continuous rounded loaf shape -->
    <path d="M -30 8 Q -34 -10 -14 -12 Q 6 -14 18 -4 Q 30 4 22 10 Q 10 16 -10 14 Q -24 13 -30 8 Z"/>
  </g>

  <!-- tail tip tucked over the nose -->
  <path d="M 20 -3 Q 10 -10 -2 -6" fill="none" stroke="#2a1533" stroke-width="4" stroke-linecap="round"/>

  <!-- ear, just the near one visible on a curled sleeping cat -->
  <path d="M -26 -9 L -30 -18 L -20 -13 Z" fill="#2a1533" stroke="#ff8fd6" stroke-width="1"/>
  <path d="M -25.5 -11 L -27.7 -15.5 L -22 -12.3 Z" fill="#ff6ec7"/>

  <!-- closed sleepy eye: a single soft curve -->
  <path d="M -22 -2 Q -19 0.5 -16 -2" fill="none" stroke="#1a0f24" stroke-width="1" stroke-linecap="round"/>

  <!-- gentle breathing rise and fall -->
  <animateTransform attributeName="transform" additive="sum" type="scale" values="1,1;1.02,1.05;1,1" dur="3s" repeatCount="indefinite"/>

  <!-- "Z" sleep bubbles drifting up -->
  <g font-family="'Consolas',monospace" font-weight="700" fill="#c9a9e8">
    <text x="-2" y="-16" font-size="7" opacity="0">
      Z
      <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-3,-10" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="4" y="-20" font-size="9" opacity="0">
      Z
      <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-4,-13" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </text>
  </g>
</g>

<rect x="1" y="1" width="818" height="216" rx="15" fill="none" stroke="#ff6ec7" stroke-opacity="0.3" stroke-width="1.5"/>
</g>
</svg>
